# Mirror one engine build here and add it to the signed list the agent reads.
#
# A hosted runner cannot build Chromium, so this only takes a build that already
# exists at `url`. Its file is checked against `sha256` before anything happens,
# because the signature on the list is what every Mac trusts from then on.
#
# Every release here says --latest=false: the application finds its own updates
# at releases/latest, and an engine marked latest would hide them.
#
# The list itself is edited by scripts/engine-list.sh, which check.yml tests on
# every pull request. See docs/releasing.md.

name: Engine

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine
        required: true
        type: choice
        options: [ginko, kitsunebi]
      version:
        description: Version, like 156.0.8080.1
        required: true
        type: string
      url:
        description: Where the zip is now
        required: true
        type: string
      sha256:
        description: SHA-256 of the zip
        required: true
        type: string
      strip_prefix:
        description: The single top-level directory in the zip, if it has one
        type: string
        default: ""
      executable:
        description: The executable inside the install directory
        required: true
        type: string
      min_app:
        description: The oldest Kitsune that can run it, like 0.6.0
        type: string
        default: ""
      notes:
        description: What changed
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: engines
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  PLATFORM: darwin-aarch64

jobs:
  mirror:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the inputs
        env:
          ENGINE: ${{ inputs.engine }}
          VERSION: ${{ inputs.version }}
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha256 }}
          STRIP: ${{ inputs.strip_prefix }}
          EXECUTABLE: ${{ inputs.executable }}
          MIN_APP: ${{ inputs.min_app }}
        run: scripts/engine-list.sh validate
      - name: Fetch and check
        env:
          URL: ${{ inputs.url }}
          SHA: ${{ inputs.sha256 }}
          ENGINE: ${{ inputs.engine }}
          VERSION: ${{ inputs.version }}
        run: |
          file="$ENGINE-$VERSION-$PLATFORM.zip"
          curl -fsSL --retry 3 -o "$file" "$URL"
          echo "$SHA  $file" | sha256sum -c -
          echo "FILE=$file" >> "$GITHUB_ENV"
      # Provenance of the mirror: that this workflow, at this commit, published
      # these bytes. What vouches for the bytes themselves is the sha256 above.
      - name: Attest the build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.FILE }}
      - name: Upload the build
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ inputs.engine }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="engine-$ENGINE-$VERSION"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --latest=false --title "$ENGINE $VERSION" --notes "Mirrored engine build." --target main
          gh release upload "$tag" "$FILE" --clobber
          echo "ASSET=https://github.com/$GH_REPO/releases/download/$tag/$FILE" >> "$GITHUB_ENV"
      - name: Add it to the list
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ inputs.engine }}
          VERSION: ${{ inputs.version }}
          URL: ${{ env.ASSET }}
          SHA: ${{ inputs.sha256 }}
          STRIP: ${{ inputs.strip_prefix }}
          EXECUTABLE: ${{ inputs.executable }}
          MIN_APP: ${{ inputs.min_app }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release view engines >/dev/null 2>&1 || \
            gh release create engines --latest=false --title "Engine list" --notes "The signed list of engine builds." --target main
          gh release download engines --pattern engines.json 2>/dev/null || echo '{"serial":0,"engines":{}}' > engines.json
          scripts/engine-list.sh add engines.json
          cat engines.json
      - name: Sign the list
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.4 signer sign engines.json
      - name: Publish the list
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload engines engines.json engines.json.sig --clobber
